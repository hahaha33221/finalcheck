<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명동 선착순 승차 확인</title>
<style>
  :root{
    --red:#F32735; --blue:#0047BB; --yellow:#FBE126;
    --ink:#1A1A1A; --sub:#595959; --muted:#9B9B9B; --rule:#E2E2E2;
    --panel:#F2F2F2; --white:#FFFFFF; --gone:#3A3A3A;
    --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --dock:0px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(28px + var(--dock))}
  button{font:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  [hidden]{display:none !important}
  .wrap{max-width:720px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums}

  .stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 70%,var(--yellow) 70% 100%)}
  header{background:var(--white);padding:16px 16px 14px;border-bottom:1px solid var(--rule)}
  .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:20px;line-height:1.3;font-weight:800;letter-spacing:-0.02em}
  .sub{margin:3px 0 0;font-size:13px;color:var(--sub)}
  .modebtn{flex:none;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .modebtn.on{background:var(--red);border-color:var(--red);color:#fff}
  .summary{display:flex;gap:18px;margin-top:14px}
  .summary div{font-size:13px;color:var(--sub)}
  .summary b{display:block;font-size:26px;color:var(--ink);font-weight:800;letter-spacing:-0.03em;line-height:1.15}
  .status{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#2DB463;flex:none}
  .dot.warn{background:#E0A100}
  .dot.err{background:var(--red)}

  .buses{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
  .buses::-webkit-scrollbar{display:none}
  .btab{flex:none;min-width:78px;border:1.5px solid var(--rule);background:var(--white);border-radius:10px;padding:7px 10px;text-align:left}
  .btab b{display:block;font-size:15px;font-weight:800}
  .btab small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
  .btab.go small{color:var(--blue);font-weight:600}
  .btab.left small{color:var(--muted)}
  .btab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
  .btab[aria-selected="true"] small{color:#E6E6E6}

  .views{display:flex;margin:12px 16px 0;background:#E4E4E4;border-radius:10px;padding:3px}
  .views button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px;font-weight:600;color:var(--sub)}
  .views button[aria-selected="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .busbox{margin:12px 16px 0;background:var(--white);border-radius:14px;padding:16px 14px 18px}
  .bushead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .bushead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em}
  .bushead .cnt{font-size:15px;color:var(--sub)}
  .bushead .cnt b{font-size:24px;color:var(--ink);font-weight:800}
  .state{margin:4px 0 0;font-size:13px;color:var(--sub)}
  .state.go{color:var(--blue);font-weight:600}
  .state.ready{color:var(--red);font-weight:700}
  .meter{margin-top:10px;height:8px;border-radius:4px;background:var(--panel);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--blue);transition:width .25s}
  .meter.full i{background:var(--red)}
  .meter.gone i{background:var(--gone)}
  .front{margin:16px 0 8px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .seats{display:grid;grid-template-columns:1fr 1fr 14px 1fr 1fr;gap:6px}
  .seat{border:1.5px solid var(--rule);background:var(--white);border-radius:9px 9px 5px 5px;min-height:54px;padding:6px 4px 5px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;overflow:hidden}
  .seat b{font-size:15px;font-weight:800;line-height:1.15}
  .seat small{font-size:10.5px;line-height:1.2;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seat.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seat.on small{color:#D6E2FA}
  .seat.gone{background:var(--gone);border-color:var(--gone);color:#fff}
  .seat.gone small{color:#BDBDBD}
  .seat.gone.empty{background:var(--panel);border-color:var(--panel);color:var(--muted)}
  .seat.empty.miss{border-color:#F7C2C6}
  body:not(.admin) .seat.empty{cursor:default}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--rule)}

  .controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);padding:12px 16px 8px}
  .search{width:100%;border:1px solid var(--rule);background:var(--white);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
  .statusrow{display:flex;gap:6px;padding-top:8px}
  .statusrow .chip{flex:1;justify-content:center}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
  .chip small{color:var(--sub)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[aria-pressed="true"] small{color:#ddd}
  .sw{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
  .filterinfo{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding-top:6px;min-height:22px}
  .linkbtn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600;padding:2px 0}
  .hint{margin:0 16px 4px;font-size:12px;color:var(--sub)}
  .grp{padding:14px 16px 6px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .grp small{font-weight:500;color:var(--sub)}
  ul{list-style:none;margin:0;padding:0 16px}
  li{margin:0 0 4px}
  .row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--white);border-radius:8px;padding:10px 12px 10px 0;cursor:default;overflow:hidden}
  .row .edge{align-self:stretch;width:5px;flex:none}
  .row .who{flex:1;min-width:0}
  .row .nm{display:block;font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
  .row .meta{display:block;font-size:12px;color:var(--sub);margin-top:1px}
  .row .role{color:var(--blue);font-weight:600}
  .row .err{display:block;font-size:12px;color:var(--red);margin-top:3px;font-weight:600}
  .row .err:empty{display:none}
  .tag{flex:none;min-width:58px;text-align:center;border-radius:6px;padding:6px 8px;font-size:13px;font-weight:700}
  .tag.off{color:var(--muted);background:var(--panel);font-weight:500}
  .tag.on{color:#fff;background:var(--blue)}
  .tag.gone{color:#fff;background:var(--gone)}
  .empty-note{margin:24px 16px;padding:28px 16px;text-align:center;background:var(--white);border-radius:10px;color:var(--sub);font-size:14px;line-height:1.6}
  .asgform{flex:none;display:flex;align-items:center;gap:5px}
  .tnum{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:8px;background:var(--white);height:38px;padding-left:8px}
  .tnum:focus-within{border-color:var(--blue)}
  .tnum span{font-size:14px;font-weight:700;color:var(--sub)}
  .tnum input{width:42px;border:0;outline:0;background:transparent;font:inherit;font-size:16px;font-weight:700;padding:0 6px 0 1px;height:100%}
  .asgbtn{border:0;border-radius:8px;background:var(--ink);color:#fff;height:38px;padding:0 11px;font-size:14px;font-weight:700}
  .done{flex:none;display:flex;align-items:center;gap:6px}
  .cxl{border:1px solid var(--rule);background:var(--white);border-radius:8px;height:32px;padding:0 9px;font-size:13px;color:var(--sub)}
  .row.flash{animation:rowflash .8s ease-out}
  @keyframes rowflash{from{background:#E3ECFB}to{background:var(--white)}}

  .dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--rule);padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  body.admin .dock{display:block}
  .dock .in{max-width:688px;margin:0 auto}
  .dock .lbl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;color:var(--sub);margin-bottom:8px}
  .dock .lbl b{color:var(--ink)}
  .dock .tools{display:flex;gap:12px;flex:none}
  .dock .tools button{border:0;background:none;color:var(--sub);font-size:12px;padding:2px 0;text-decoration:underline}
  .depart{width:100%;border:0;border-radius:12px;padding:15px 12px;font-size:16px;font-weight:800;background:var(--red);color:#fff}
  .depart:disabled{background:#E4E4E4;color:#8A8A8A;font-weight:600}
  .depart.done{background:var(--gone);color:#fff}
  .dock .sec{display:flex;justify-content:center;margin-top:8px}
  .dock .sec button{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;padding:2px 4px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--dock));z-index:30;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.4;display:none;align-items:center;justify-content:center;gap:14px;width:min(440px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
  .toast.show{display:flex}

  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  .modal{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:560px){ .scrim{align-items:center;padding:20px} .modal{border-radius:16px} }
  .modal h3{margin:0 0 6px;font-size:19px}
  .modal p{margin:0 0 14px;font-size:14px;color:var(--sub);line-height:1.6;white-space:pre-line}
  .acts{display:flex;flex-direction:column;gap:8px}
  .acts button{border:1px solid var(--rule);background:var(--white);border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
  .acts .primary{background:var(--red);border-color:var(--red);color:#fff}
  .acts .dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .acts .danger{color:var(--red);border-color:#F7C2C6}
  .acts .quiet{border-color:transparent;color:var(--sub);font-weight:600}

  body.saving .row,body.saving .depart,body.saving #resetBtn,body.saving #secBtn,body.saving .seat,body.saving .modebtn,body.saving .asgbtn,body.saving .cxl{pointer-events:none;opacity:.55}

  @media (prefers-reduced-motion:reduce){ .row.flash{animation:none} .meter i{transition:none} }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <header>
    <div class="toprow">
      <div>
        <h1>명동 선착순 승차 확인</h1>
        <p class="sub" id="modeText">보기 전용</p>
      </div>
      <button class="modebtn" id="adminBtn" type="button">관리자</button>
    </div>
    <div class="summary">
      <div><b class="num" id="sumBoard">0</b>배정 완료</div>
      <div><b class="num" id="sumLeft">0</b>미배정</div>
      <div><b class="num" id="sumGone">0</b>출발 차량</div>
    </div>
    <div class="status" role="status"><span class="dot" id="dot"></span><span id="statusText">불러오는 중</span><button class="linkbtn" id="refreshBtn" type="button">새로고침</button></div>
  </header>

  <div class="buses" id="buses" role="tablist" aria-label="호차 선택"></div>

  <div class="views" role="tablist" aria-label="보기 방식">
    <button type="button" role="tab" data-v="roster" id="vRoster" aria-selected="true">명단</button>
    <button type="button" role="tab" data-v="seats" id="vSeats" aria-selected="false">차량 현황</button>
  </div>

  <section id="rosterView">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="이름 검색" autocomplete="off" aria-label="이름 검색">
      <div class="statusrow" id="statusChips" aria-label="배정 상태"></div>
      <div class="chips" id="chips" aria-label="조 선택"></div>
      <div class="filterinfo"><span id="filterText"></span><button class="linkbtn" id="clearBtn" type="button" hidden>필터 해제</button></div>
    </div>
    <p class="hint" id="rosterHint"></p>
    <div id="list"></div>
  </section>

  <section id="seatView" hidden>
    <div class="busbox">
      <div class="bushead">
        <h2 id="busTitle">1호차</h2>
        <div class="cnt num"><b id="busCount">0</b> / 44석</div>
      </div>
      <p class="state" id="busState"></p>
      <div class="meter" id="meter"><i id="meterFill" style="width:0"></i></div>
      <div class="front"><span>앞쪽 (운전석)</span><span>출입문</span></div>
      <div class="seats" id="seats"></div>
      <div class="legend">
        <span><i></i>빈 번호</span>
        <span><i style="background:var(--blue);border-color:var(--blue)"></i>배정됨</span>
        <span><i style="background:var(--gone);border-color:var(--gone)"></i>출발 확정</span>
      </div>
    </div>
  </section>
</div>

<div class="dock" id="dock" aria-label="관리자 도구">
  <div class="in">
    <div class="lbl"><span id="dockHint"></span><span class="tools"><button type="button" id="resetBtn">전체 초기화</button><button type="button" id="logoutBtn">나가기</button></span></div>
    <button type="button" class="depart" id="departBtn" disabled>최종확인</button>
    <div class="sec"><button type="button" id="secBtn" hidden></button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span></div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<script id="state-data" type="application/json">{"t":{},"d":{},"u":0}</script>

const BUS_COUNT = 8;
const SEATS = 44;
const BUSES = Array.from({length:BUS_COUNT}, (_,i) => i + 1);

const SELF_SRC = document.currentScript ? document.currentScript.textContent : '';

const byId = Object.fromEntries(PEOPLE.map(p => [p.i, p]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const SEARCH = Object.fromEntries(PEOPLE.map(p => [p.i, fold(p.n + ' ' + p.r)]));
const hm = t => t ? new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '-';
const hms = t => t ? new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '-';
const key = (b,n) => `${b}-${n}`;
const busOf = k => +k.split('-')[0];
const gone = b => !!S.d[b];
const countBus = b => { let c = 0; for(let n = 1; n <= SEATS; n++) if(S.t[key(b,n)]) c++; return c; };
const emptyNums = b => { const a = []; for(let n = 1; n <= SEATS; n++) if(!S.t[key(b,n)]) a.push(n); return a; };
function ownedMap(){ const m = {}; for(const k in S.t){ if(S.t[k].p) m[S.t[k].p] = k; } return m; }
const firstOpenBus = () => BUSES.find(x => !gone(x));

let S = {t:{}, d:{}, u:0};
let isAdmin = false, curBus = 1, view = 'roster';
let fGroup = 0, fState = 'all', query = '';
let saving = false, flashId = null;
let artifactApi = null, noStorage = false;

const $ = id => document.getElementById(id);

function buildDocument(state){
  const stateJson = JSON.stringify(state).replace(/</g, '<');
  return SHELL_HEAD + SHELL_BODY
    + '\n<script id="state-data" type="application/json">' + stateJson + '<' + '/script>\n'
    + '<script>' + SELF_SRC + '<' + '/script>\n'
    + '</body>\n</html>';
}

function setStatus(kind, text){
  $('dot').className = 'dot' + (kind === 'ok' ? '' : kind === 'warn' ? ' warn' : ' err');
  $('statusText').textContent = text;
}
function okStatus(){
  if(noStorage){ setStatus('err','저장 기능이 없는 환경입니다. 이 화면은 보기 전용입니다.'); return; }
  setStatus('ok', (isAdmin ? '관리자 모드' : '보기 전용') + (S.u ? (', 마지막 변경 ' + hms(S.u)) : ''));
}

function render(){
  document.body.classList.toggle('saving', saving);
  const owned = ownedMap();
  const assigned = Object.keys(owned).length;
  $('sumBoard').textContent = assigned;
  $('sumLeft').textContent = PEOPLE.length - assigned;
  $('sumGone').textContent = BUSES.filter(gone).length;

  $('buses').innerHTML = BUSES.map(b => {
    const c = countBus(b);
    let cls = '', txt;
    if(gone(b)){ cls = 'left'; txt = `출발 ${hm(S.d[b])}`; }
    else if(c){ cls = 'go'; txt = `${c}/${SEATS}`; }
    else txt = '대기';
    return `<button type="button" role="tab" class="btab ${cls}" data-b="${b}" aria-selected="${b === curBus}"><b>${b}호차</b><small class="num">${txt}</small></button>`;
  }).join('');

  $('vSeats').setAttribute('aria-selected', view === 'seats');
  $('vRoster').setAttribute('aria-selected', view === 'roster');
  $('seatView').hidden = view !== 'seats';
  $('rosterView').hidden = view !== 'roster';

  renderRoster(owned);
  renderSeats();
  renderDock();
}

function renderRoster(owned){
  const grpCt = {}; GROUPS.forEach(g => grpCt[g.id] = {done:0,total:0});
  for(const p of PEOPLE){ grpCt[p.g].total++; if(owned[p.i]) grpCt[p.g].done++; }
  const assigned = Object.keys(owned).length;

  $('statusChips').innerHTML = [
    ['all','전체',PEOPLE.length], ['todo','미배정',PEOPLE.length - assigned], ['done','배정됨',assigned]
  ].map(([v,l,n]) => `<button type="button" class="chip" data-s="${v}" aria-pressed="${fState === v}">${l} <small class="num">${n}</small></button>`).join('');

  $('chips').innerHTML =
    `<button type="button" class="chip" data-g="0" aria-pressed="${fGroup === 0}">모든 조</button>` +
    GROUPS.map(g => `<button type="button" class="chip" data-g="${g.id}" aria-pressed="${fGroup === g.id}"><span class="sw" style="background:${g.color}"></span>${g.id}. ${g.name} <small class="num">${grpCt[g.id].done}/${grpCt[g.id].total}</small></button>`).join('');

  const open = !gone(curBus);
  $('rosterHint').textContent = !isAdmin
    ? '이름 옆 번호가 배정된 차량과 번호입니다. 1-7은 1호차 7번입니다.'
    : open
      ? `미배정 이름 옆 칸에 번호를 넣고 배정을 누르세요. 7을 넣으면 ${curBus}-7로 배정됩니다.`
      : `${curBus}호차는 출발했습니다. 위에서 배정할 호차를 고르세요.`;

  const qf = fold(query.trim());
  const rows = PEOPLE.filter(p =>
    (!fGroup || p.g === fGroup) &&
    (fState === 'all' || (fState === 'todo' ? !owned[p.i] : !!owned[p.i])) &&
    (!qf || SEARCH[p.i].includes(qf)));

  const parts = [];
  if(fState !== 'all') parts.push(fState === 'todo' ? '미배정' : '배정됨');
  if(fGroup) parts.push(`${fGroup}. ${GROUPS[fGroup-1].name}`);
  if(qf) parts.push(`"${query.trim()}"`);
  $('filterText').textContent = parts.length ? `${parts.join(', ')} 결과 ${rows.length}명` : `${rows.length}명`;
  $('clearBtn').hidden = !parts.length;

  if(!rows.length){
    $('list').innerHTML = `<div class="empty-note">${fState === 'todo' && !qf && !fGroup ? '모든 사람이 배정되었습니다.' : '조건에 맞는 사람이 없습니다.<br>필터를 해제하거나 검색어를 바꿔 보세요.'}</div>`;
    return;
  }

  let html = '', cg = null;
  for(const p of rows){
    if(p.g !== cg){
      if(cg !== null) html += '</ul>';
      const g = GROUPS[p.g-1];
      html += `<div class="grp"><span class="sw" style="background:${g.color}"></span>${g.id}. ${g.name} <small class="num">${grpCt[g.id].done}/${grpCt[g.id].total}</small></div><ul>`;
      cg = p.g;
    }
    const k = owned[p.i];
    const meta = [p.r ? `<span class="role">${esc(p.r)}</span>` : '', esc(p.s)].filter(Boolean).join(' / ');
    let right;
    if(k){
      const g = gone(busOf(k));
      right = `<span class="done"><span class="tag num ${g ? 'gone' : 'on'}">${k}</span>${isAdmin && !g ? `<button type="button" class="cxl" data-cancel="${k}" aria-label="${esc(p.n)} ${k} 배정 취소">취소</button>` : ''}</span>`;
    }else if(isAdmin && open){
      right = `<span class="asgform"><label class="tnum"><span>${curBus}-</span><input class="tno" data-id="${p.i}" inputmode="numeric" enterkeyhint="done" autocomplete="off" maxlength="5" placeholder="번호" aria-label="${esc(p.n)} 번호 입력"></label><button type="button" class="asgbtn" data-asg="${p.i}">배정</button></span>`;
    }else{
      right = '<span class="tag off">미배정</span>';
    }
    html += `<li><div class="row${flashId === p.i ? ' flash' : ''}" data-id="${p.i}">
      <span class="edge" style="background:${GROUPS[p.g-1].color}"></span>
      <span class="who"><span class="nm">${esc(p.n)}</span>${meta ? `<span class="meta">${meta}</span>` : ''}<span class="err" id="err-${p.i}"></span></span>${right}</div></li>`;
  }
  $('list').innerHTML = html + '</ul>';
  flashId = null;
}

function renderSeats(){
  const b = curBus, c = countBus(b), g = gone(b);
  $('busTitle').textContent = `${b}호차`;
  $('busCount').textContent = c;
  $('meterFill').style.width = (c / SEATS * 100) + '%';
  $('meter').className = 'meter' + (g ? ' gone' : c === SEATS ? ' full' : '');
  const st = $('busState');
  if(g){ st.className = 'state'; st.textContent = `${hm(S.d[b])} 최종확인, 출발했습니다. 더 이상 수정할 수 없습니다.`; }
  else if(c === SEATS){ st.className = 'state ready'; st.textContent = '44번까지 모두 찼습니다. 확인 후 최종확인을 누르세요.'; }
  else if(c){ st.className = 'state go'; st.textContent = `배정 중, 빈 번호 ${SEATS - c}개`; }
  else { st.className = 'state'; st.textContent = '아직 배정된 사람이 없습니다.'; }

  let html = '';
  for(let n = 1; n <= SEATS; n++){
    const k = key(b,n), t = S.t[k];
    if(n % 4 === 3) html += '<span aria-hidden="true"></span>';
    const nm = t ? (byId[t.p]?.n || '') : '';
    const cls = ['seat', t ? (g ? 'gone' : 'on') : (g ? 'gone empty' : 'empty')];
    if(!t && !g && c > 0) cls.push('miss');
    html += `<button type="button" class="${cls.join(' ')}" data-k="${k}" aria-label="${esc(t ? `${k} ${nm}` : `${k} 빈 번호`)}">
      <b class="num">${k}</b><small>${t ? esc(nm) : (g ? '빈자리' : '&nbsp;')}</small></button>`;
  }
  $('seats').innerHTML = html;
}

function renderDock(){
  document.body.classList.toggle('admin', isAdmin);
  $('adminBtn').classList.toggle('on', isAdmin);
  $('adminBtn').textContent = isAdmin ? '관리자 모드' : '관리자';
  $('modeText').textContent = isAdmin ? '관리자 편집 중' : '보기 전용';
  if(!isAdmin){ document.documentElement.style.setProperty('--dock','0px'); return; }

  const b = curBus, c = countBus(b), g = gone(b), btn = $('departBtn'), sec = $('secBtn');
  btn.className = 'depart';
  sec.hidden = true;
  if(saving){
    btn.disabled = true;
    btn.textContent = '저장 중...';
    $('dockHint').textContent = '저장하는 중입니다. 잠시만 기다려 주세요.';
  }else if(g){
    btn.disabled = true; btn.classList.add('done');
    btn.textContent = `${b}호차 출발 완료 (${hm(S.d[b])}, ${c}명)`;
    sec.hidden = false; sec.textContent = '최종확인 해제'; sec.dataset.act = 'undepart';
    $('dockHint').textContent = '최종확인된 차량은 수정할 수 없습니다.';
  }else{
    const em = emptyNums(b);
    if(c === SEATS){
      btn.disabled = false;
      btn.textContent = `${b}호차 최종확인 후 출발 (${c}/${SEATS})`;
      $('dockHint').innerHTML = `<b>${b}호차</b> 44명 배정 완료. 최종확인 전에는 명단에서 취소할 수 있습니다.`;
    }else{
      btn.disabled = true;
      btn.textContent = `44번까지 모두 차면 최종확인 (${c}/${SEATS})`;
      const list = em.slice(0, 8).join(', ') + (em.length > 8 ? ` 외 ${em.length - 8}개` : '');
      $('dockHint').innerHTML = `<b>${b}호차</b> 빈 번호: ${list}`;
      if(c > 0){ sec.hidden = false; sec.textContent = '인원 미달로 지금 최종확인'; sec.dataset.act = 'early'; }
    }
  }
  requestAnimationFrame(() => document.documentElement.style.setProperty('--dock', $('dock').offsetHeight + 'px'));
}

let toastTimer;
function toast(text){
  $('toastText').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
}

let modalDone = null;
function openModal(html, onClick){
  $('modal').innerHTML = html;
  $('scrim').classList.add('show');
  modalDone = { onClick };
  setTimeout(() => ($('modal').querySelector('input') || $('modal').querySelector('button'))?.focus(), 30);
}
function closeModal(){ $('scrim').classList.remove('show'); $('modal').innerHTML = ''; modalDone = null; }
$('scrim').addEventListener('click', e => { if(e.target === $('scrim')) closeModal(); });
$('modal').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if(!b || !modalDone) return;
  if(b.dataset.a === 'close'){ closeModal(); return; }
  modalDone.onClick && modalDone.onClick(b.dataset.a, b);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('scrim').classList.contains('show')) closeModal(); });

function whenClosed(res, val){
  const obs = setInterval(() => { if(!$('scrim').classList.contains('show')){ clearInterval(obs); res(val); } }, 200);
}
function confirmBox({title, desc, ok, kind = 'primary'}){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><p>${esc(desc)}</p>
      <div class="acts"><button type="button" class="${kind}" data-a="ok">${esc(ok)}</button><button type="button" class="quiet" data-a="close">취소</button></div>`,
      a => { if(a === 'ok'){ closeModal(); res(true); } });
    whenClosed(res, false);
  });
}

function stashUI(){
  try{
    sessionStorage.setItem('mdboard-ui', JSON.stringify({curBus, view, fGroup, fState, query}));
  }catch(e){}
}
function restoreUI(){
  try{
    const raw = sessionStorage.getItem('mdboard-ui');
    if(raw){
      const u = JSON.parse(raw);
      if(u.curBus) curBus = u.curBus;
      if(u.view) view = u.view;
      if(u.fGroup !== undefined) fGroup = u.fGroup;
      if(u.fState) fState = u.fState;
      if(u.query) query = u.query;
      sessionStorage.removeItem('mdboard-ui');
    }
  }catch(e){}
}

async function mutate(applyFn, savingMsg){
  if(!isAdmin || noStorage || saving) return false;
  if(!artifactApi){ toast('저장 기능을 사용할 수 없습니다.'); return false; }
  const snapshot = JSON.parse(JSON.stringify(S));
  applyFn();
  S.u = Date.now();
  saving = true;
  render();
  if(savingMsg) toast(savingMsg);
  setStatus('warn','저장 중');
  stashUI();
  try{
    await artifactApi.publish(buildDocument(S));
    setTimeout(() => { if(saving) location.reload(); }, 4000);
  }catch(err){
    saving = false;
    S = snapshot;
    const code = err && err.code;
    if(code === 'not_writer' || code === 'not_granted'){
      isAdmin = false;
      try{ sessionStorage.removeItem('mdboard-admin'); }catch(e){}
      toast('이 링크는 보기 전용입니다. 관리자만 수정할 수 있습니다.');
    }else if(code === 'conflict'){
      toast('다른 곳에서 방금 갱신되어 곧 새로고침됩니다.');
    }else if(code === 'rate_limited'){
      toast('너무 빠르게 저장했습니다. 잠시 후 다시 시도해 주세요.');
    }else{
      toast('저장에 실패했습니다. 다시 시도해 주세요.');
    }
    render();
    okStatus();
  }
}

function parseTicket(raw){
  const s = raw.trim().replace(/번$/, '');
  if(!s) return {err:'번호를 입력하세요.'};
  let b, n, m;
  if((m = s.match(/^(\d+)\s*[-.\s]\s*(\d+)$/))){ b = +m[1]; n = +m[2]; }
  else if(/^\d+$/.test(s)){ b = curBus; n = +s; }
  else return {err:'7 또는 1-7처럼 숫자로 입력하세요.'};
  if(b < 1 || b > BUS_COUNT) return {err:`호차는 1~${BUS_COUNT} 사이여야 합니다.`};
  if(n < 1 || n > SEATS) return {err:`번호는 1~${SEATS} 사이여야 합니다.`};
  return {b, n};
}

function assign(id, raw){
  const errEl = $('err-' + id);
  const r = parseTicket(raw);
  if(r.err){ errEl.textContent = r.err; return; }
  const k = key(r.b, r.n);
  if(gone(r.b)){ errEl.textContent = `${r.b}호차는 이미 출발했습니다.`; return; }
  if(S.t[k]){ errEl.textContent = `${k}번은 이미 ${byId[S.t[k].p]?.n || '다른 사람'}에게 배정되어 있습니다.`; return; }
  const mine = ownedMap()[id];
  if(mine){ errEl.textContent = `이미 ${mine}번으로 배정되어 있습니다.`; return; }
  const usedSearch = !!query.trim();
  mutate(() => { S.t[k] = {at: Date.now(), p: id}; flashId = id; }, `${byId[id].n}, ${k}번 배정 저장 중`);
  if(usedSearch){ query = ''; $('q').value = ''; }
}

function cancel(k){
  const t = S.t[k]; if(!t || gone(busOf(k))) return;
  mutate(() => { delete S.t[k]; flashId = t.p; }, `${byId[t.p]?.n || ''}, ${k}번 배정 취소 저장 중`);
}

function seatSheet(k){
  const t = S.t[k]; if(!t) return;
  const b = busOf(k), g = gone(b), p = byId[t.p];
  const canEdit = isAdmin && !g;
  const desc = `${p ? p.n : '-'}\n배정 시각 ${hms(t.at)}` + (g ? `\n${b}호차는 최종확인되어 수정할 수 없습니다.` : '');
  openModal(`<h3>${esc(k)}번</h3><p>${esc(desc)}</p><div class="acts">
      ${canEdit ? `<button type="button" class="danger" data-a="cancel">${esc(k)}번 배정 취소</button>` : ''}
      <button type="button" class="quiet" data-a="close">닫기</button></div>`,
    a => { if(a === 'cancel' && canEdit){ closeModal(); cancel(k); } });
}

async function depart(b, early){
  const c = countBus(b);
  let desc = `${b}호차 ${c}명을 최종확인하고 출발 처리합니다.\n최종확인 후에는 이 차량의 배정을 취소하거나 바꿀 수 없습니다.`;
  if(early){
    const em = emptyNums(b);
    desc += `\n\n아직 ${em.length}개 번호가 비어 있습니다: ${em.slice(0,12).join(', ')}${em.length > 12 ? ' 등' : ''}`;
  }
  const ok = await confirmBox({ title: early ? `${b}호차 인원 미달 최종확인` : `${b}호차 최종확인`, desc, ok: early ? `${c}명으로 출발` : '최종확인, 출발' });
  if(!ok || gone(b)) return;
  mutate(() => {
    S.d[b] = Date.now();
    const nxt = BUSES.find(x => x > b && !gone(x)) || firstOpenBus();
    if(nxt) curBus = nxt;
  }, `${b}호차 출발 처리를 저장하는 중입니다.`);
}

$('adminBtn').onclick = async () => {
  if(isAdmin) return;
  if(noStorage){ toast('이 환경에서는 저장 기능을 사용할 수 없어 관리자 모드를 쓸 수 없습니다.'); return; }
  const ok = await confirmBox({
    title:'관리자 모드로 전환',
    desc:'관리자 모드에서는 번호 배정과 출발 확인을 저장할 수 있습니다.\n이 페이지를 수정할 권한이 있는 경우에만 저장되며, 권한이 없으면 첫 시도에서 자동으로 보기 전용으로 돌아갑니다.',
    ok:'관리자 모드로 전환', kind:'dark'
  });
  if(!ok) return;
  isAdmin = true;
  try{ sessionStorage.setItem('mdboard-admin','1'); }catch(e){}
  okStatus(); render();
};
$('logoutBtn').onclick = () => {
  isAdmin = false;
  try{ sessionStorage.removeItem('mdboard-admin'); }catch(e){}
  okStatus(); render(); toast('보기 전용으로 전환했습니다.');
};
$('refreshBtn').onclick = () => location.reload();

$('resetBtn').onclick = async () => {
  const ok = await confirmBox({ title:'전체 초기화', desc:'모든 번호 배정과 최종확인 기록을 지웁니다.\n링크로 보는 모든 사람의 화면에도 반영되며 되돌릴 수 없습니다.', ok:'모두 지우기', kind:'dark' });
  if(!ok) return;
  mutate(() => { S.t = {}; S.d = {}; curBus = 1; }, '전체 초기화를 저장하는 중입니다.');
};

$('buses').addEventListener('click', e => {
  const b = e.target.closest('.btab'); if(!b) return;
  curBus = +b.dataset.b;
  render();
});
document.querySelector('.views').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if(!b) return;
  view = b.dataset.v; render();
});

$('list').addEventListener('click', e => {
  if(!isAdmin) return;
  const a = e.target.closest('[data-asg]');
  if(a){ const inp = document.querySelector(`.tno[data-id="${a.dataset.asg}"]`); assign(a.dataset.asg, inp.value); return; }
  const c = e.target.closest('[data-cancel]');
  if(c) cancel(c.dataset.cancel);
});
$('list').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.classList.contains('tno')){ e.preventDefault(); assign(e.target.dataset.id, e.target.value); }
});
$('list').addEventListener('input', e => {
  if(e.target.classList.contains('tno')){ const el = $('err-' + e.target.dataset.id); if(el) el.textContent = ''; }
});

$('seats').addEventListener('click', e => {
  const s = e.target.closest('.seat'); if(!s) return;
  if(S.t[s.dataset.k]) seatSheet(s.dataset.k);
  else if(isAdmin && !gone(curBus)) toast('명단에서 이름 옆에 번호를 입력해 배정하세요.');
});

$('statusChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  fState = b.dataset.s; render();
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  const g = +b.dataset.g; fGroup = fGroup === g ? 0 : g; render();
});
let qTimer;
$('q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value; render(); }, 120); });
$('clearBtn').onclick = () => { fGroup = 0; fState = 'all'; query = ''; $('q').value = ''; render(); };

$('departBtn').onclick = () => { if(isAdmin && countBus(curBus) === SEATS && !gone(curBus) && !saving) depart(curBus, false); };
$('secBtn').onclick = async () => {
  if(!isAdmin || saving) return;
  const b = curBus;
  if($('secBtn').dataset.act === 'early' && !gone(b)){ depart(b, true); return; }
  if($('secBtn').dataset.act === 'undepart' && gone(b)){
    const ok = await confirmBox({ title:`${b}호차 최종확인 해제`, desc:'실수로 최종확인을 눌렀을 때만 사용하세요.\n해제하면 이 차량의 배정을 다시 수정할 수 있습니다.', ok:'최종확인 해제', kind:'dark' });
    if(!ok) return;
    mutate(() => { delete S.d[b]; }, `${b}호차 최종확인 해제를 저장하는 중입니다.`);
  }
};

window.addEventListener('resize', () => isAdmin && renderDock());

(async function init(){
  const stateEl = document.getElementById('state-data');
  if(stateEl){
    try{ const d = JSON.parse(stateEl.textContent); S = {t: d.t || {}, d: d.d || {}, u: d.u || 0}; }catch(e){}
  }
  restoreUI();
  $('q').value = query;
  render();

  artifactApi = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null;
  noStorage = !artifactApi;

  let wasAdmin = false;
  try{ wasAdmin = sessionStorage.getItem('mdboard-admin') === '1'; }catch(e){}
  isAdmin = !noStorage && wasAdmin;

  if(!curBus || (gone(curBus) && firstOpenBus())) { const f = firstOpenBus(); if(f) curBus = f; }
  render();
  okStatus();
})();
</script>
</body>
</html>
